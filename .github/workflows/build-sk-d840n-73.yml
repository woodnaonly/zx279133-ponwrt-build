name: ZX279133 SK-D840N Build (Linux 7.3 line)

# The 7.3 bring-up line.
#
# It builds the same board on the kernel generation the reference firmware
# runs (Linux 7.3.4), with cnjn's rewritten ZX279133 NPU driver, and it does
# NOT publish anything: the release line is build-sk-d840n.yml, and this
# workflow only produces an image to look at.
#
# The kernel is not a submodule and not a fork here.  cnjn ships the driver
# as a patch series (target/linux/zte/patches-7.3) that is applied to a
# VANILLA linux-7.3.4, so this workflow:
#
#   1. fetches linux-7.3.4.tar.xz and refuses it unless its sha256 matches
#      configs/sk-d840n-73.json,
#   2. applies the vendored series in kernel-patches/7.3/ one patch at a time,
#      refusing anything that does not apply cleanly,
#   3. copies the board layer (device tree, Unim NAND, DSA VID range) on top,
#      and the NPU microcode into the tree,
#   4. hands the result to OpenWrt through CONFIG_EXTERNAL_KERNEL_TREE.
#
# Every step of 1-3 has been run on the build machine of this repository and
# is the same code as tools/prepare-sk-kernel-73.py and
# tools/apply-sk-overlay-73.sh.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '构建模式'
        required: false
        default: 'initramfs'
        type: choice
        options: ['initramfs', 'flash']
      clean_cache:
        description: '忽略 dl/ 缓存'
        required: false
        default: 'false'
        type: boolean
  push:
    paths:
      - .github/workflows/build-sk-d840n-73.yml
      - kernel-patches/**
      - tools/prepare-sk-kernel-73.py
      - tools/apply-sk-overlay-73.sh
      - tools/check-sk-board-api.py
      - tools/check-sk-switch-api.py
      - tools/check-sk-pon-api.py
      - tools/check-sk-9132-api.py
      - tools/check-conduit-netdev-name.py
      - tools/kcheck.py
      - tools/kshadow.py
      - tests/test_sk_kcheck.py
      - tests/test_conduit_netdev_name.py
      # The image gate: it asks the artifact that is about to be flashed whether
      # it carries the drivers this line owns, so a change to the gate, to its
      # probe list or to its negative controls changes what the build checks.
      - tools/check-sk-image-drivers.py
      - configs/sk-d840n-73-image-drivers.json
      - tests/test_sk_image_drivers.py
      # The lint that keeps a kernel version out of a decision, and the list
      # of the places where a version really belongs: both change what the
      # build checks.
      - tools/check-baked-version.py
      - configs/baked-version-allow.json
      - tests/test_sk_baked_version.py
      # The gate that compares the kernel version a release says it ships
      # with the version the image announces, and the controls that say
      # whether it still refuses a report that names the wrong kernel.
      - tools/check-release-kernel-version.py
      - tests/test_release_kernel_version.py
      # The gate that says a TX ring with an untrusted completion counter is
      # quarantined, and the controls that say whether it still notices when
      # the quarantine is taken out.
      - tools/check-sk-tx-isolation.py
      - tests/test_sk_tx_isolation.py
      # The gate that says the isolation's counters are published where the
      # board can read them, and the controls that say whether it still
      # notices when they are taken out.
      - tools/check-sk-tx-isolation-stats.py
      - tests/test_sk_tx_isolation_stats.py
      # The gate that says the tree has a way back from a datapath that
      # could not be brought up, and the controls that say whether it still
      # notices when that way back is taken away.
      - tools/check-sk-datapath-restore.py
      - tests/test_sk_datapath_restore.py
      # The gate that says the machine code of the conduit's open puts the
      # restore in front of the check for the hardware, and the controls that
      # say whether it still notices when that order is broken.
      - tools/check-sk-kernel-order.py
      - tests/test_sk_kernel_order.py
      # The same gate's own logic, checked on a kernel built for the purpose:
      # it needs the tree, so it runs in the build job and not in the gates
      # job - which has no tree.
      - tests/test_sk_kernel_order_local.py
      # The gate on the gates: it decides which steps this line has and
      # which paths start a build, so a change to it changes what the build
      # checks and has to start a build.
      - tests/test_sk_workflows.py
      # The gate that says the receive path proves what it hands over, and the
      # controls that say whether it still notices when the proof is taken out.
      - tools/check-sk-rx-delivery.py
      - tests/test_sk_rx_delivery.py
      # The control that says the prepare step's content check still bites:
      # the prepare decides what tree the build compiles, so a change to it
      # changes what the build checks.
      - tests/test_sk_prepare_content.py
      # The control that says the prepare's apply really lands a patch in a
      # tree that sits inside this checkout: git drops such a patch without
      # a word, and the tree would keep the older driver.
      - tests/test_sk_prepare_apply_context.py
      # The text hygiene control: a replacement character in a document
      # makes every search against that document come back empty.
      - tests/test_sk_text_hygiene.py
      # The flash gate: it decides which bytes may be written to a board, so a
      # change to it - or to the controls that say whether it still refuses
      # what it used to - changes what the build checks.
      - tools/gatecheck.sh
      - tools/uimage-kver.py
      - tests/test_gatecheck.py
      # The gate payload: it writes the round's report only for the kernel it was
      # built for, so the version it rides has to be read from the image.
      - tools/mkctlram.py
      - tests/test_ctl_payload.py
      - kernel-overlays-73/**
      - tools/prepush.py
      - overlays-73/**
      - configs/sk-d840n-73.json
      - scripts/configure-sk-d840n.sh
      # The Configure step sources these two, so a change in either of them
      # changes what this line builds and has to start a build.
      - scripts/sk-d840n-offload.sh
      - scripts/sk-d840n-theme.sh
      # The files this line runs but did not list: four of the repository's
      # own controls, the LED gate and its control, the dtb-compat gate, the
      # sysupgrade check, the partition tool and the UI script.  A change to
      # a file the workflow runs changes what the build checks, so it has to
      # start a build - and these ones did not, so a fix to the LED gate or
      # to the partition export would have been pushed and never run.
      - tests/test_sk_kernel.py
      - tests/test_sk_led_dts_gate.py
      - tests/test_sk_layout.py
      - tests/test_sk_uboot.py
      - scripts/prepare-sk-d840n-ui.sh
      - tools/check-sk-dtb-compat.py
      - tools/check_sysupgrade.py
      - tools/dtbparts.py
      - tools/check-sk-lan1-led.py
      - tests/test_sk_lan1_led.py
      # The gate that says every file this workflow runs is covered by these
      # paths, and the control that says whether it still notices when one of
      # them is dropped.
      - tools/check-sk-workflow-paths.py
      - tests/test_sk_workflow_paths.py
      # The compressor the image profile runs, and the OpenWrt-side overlays
      # this line copies into the tree.  Both are inputs of the image and
      # neither was listed: editing the compressor would have left the 7.3
      # image compressed by the old script.
      - tools/mkgzip.py
      - overlays/**
      # The offload profile the shared configure script reads.  It is a
      # dependency of a script, not of a step, so nothing named it.
      - configs/sk-d840n-offload.config
      # Every markdown file in the repository, not just this line's own
      # document: the text hygiene control reads all of them, and this line
      # is the only line that runs it - the release line does not - so a
      # broken character in a document outside docs/101- would have reached
      # the repository without a build ever checking it.
      - '**.md'

env:
  IW_URL: https://github.com/cnjn/ImmortalWrt
  IW_BRANCH: master
  # cnjn/ImmortalWrt master, 2026-11-10.  This is the commit that carries
  # target/linux/zte/patches-7.3 and target/linux/zte/zx279133/config-7.3.
  IW_SHA: 31e2ac4ded9c8896c7aefd3dcb9a46ef77440fbd
  KVER: '7.3.4'
  KERNEL_TREE: linux-7.3.4

permissions: write-all

jobs:
  check-gates:
    name: repository gates
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install DTS regression tools
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends device-tree-compiler libfdt-dev python3-yaml
      - name: Exercise the repository's own gates
        run: |
          python3 tests/test_sk_kernel.py
          python3 tests/test_sk_kcheck.py
          python3 tests/test_sk_led_dts_gate.py
          python3 tests/test_sk_layout.py
          python3 tests/test_sk_uboot.py
          python3 tests/test_sk_workflows.py
          python3 tests/test_conduit_netdev_name.py
          python3 tests/test_gatecheck.py
          python3 tests/test_ctl_payload.py
          python3 tests/test_sk_image_drivers.py
          # No script of this repository may decide something with a kernel
          # version written into it: a version in a decision is right for one
          # line and wrong for every other one, and three gates once refused
          # a good image for exactly that reason.
          python3 tests/test_sk_baked_version.py
          python3 tools/check-baked-version.py
          # The release says which kernel it ships; the image has to agree.
          python3 tests/test_release_kernel_version.py
          # The prepare step decides what the tree the build compiles is.
          # Its content check is what keeps a patch that applied without
          # landing from reaching the compiler, so the control that says
          # the check still bites runs with the rest of the gates.
          python3 tests/test_sk_prepare_content.py
          # The apply context: a patch that git drops without a word leaves
          # the tree with the older driver, and the build compiles it.
          python3 tests/test_sk_prepare_apply_context.py
          # A replacement character in a document is a character the reader
          # cannot read, and it makes ripgrep treat the whole file as
          # binary - so every search against it comes back empty, silently.
          python3 tests/test_sk_text_hygiene.py
          # The paths: list says which changes start this build, so a file
          # the workflow runs but does not list is a file whose change is
          # never checked: the gate that reads it stops being checked the
          # moment it is edited.  This line had ten such files, and the
          # release line had two.
          python3 tools/check-sk-workflow-paths.py \
            --workflow .github/workflows/build-sk-d840n-73.yml \
            --workflow .github/workflows/build-sk-d840n.yml
          python3 tests/test_sk_workflow_paths.py

  build:
    name: ${{ matrix.mode }}
    needs: check-gates
    strategy:
      fail-fast: false
      matrix:
        mode: [initramfs, flash]
    runs-on: ubuntu-22.04
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --force || true
          sudo -E apt-get -qq autoremove --purge || true
          df -hT

      - name: Init build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libfdt-dev libglib2.0-dev libgmp3-dev libjson-c-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp \
            nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-venv python3-ply python3-docutils \
            python3-pyelftools bc dwarves qemu-utils qemu-user re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      # The image's kernel is compressed by zopfli, not gzip.  The image
      # profile's Build/skd840n-gzip runs
      #   $(SKD840N_HOST_PYTHON) -u scripts/skd840n-mkgzip.py ...
      # and that script does "import zopfli.gzip" with no fallback: the
      # fixed 8 MiB kernel partition cannot be reached with gzip -9
      # (measured on the 6.18 line: 8,397,374 bytes against 8,388,608,
      # 8,766 over), which is the whole reason the script exists.
      #
      # So the build needs the Python binding, and it needs it under the
      # interpreter the image profile is told to use: SKD840N_HOST_PYTHON,
      # which the profile leaves at its default of "python3".
      #
      # The 6.18 release line has this step; the 7.3 line had none, so its
      # image stage would have died with "ModuleNotFoundError: No module
      # named 'zopfli'" - after the kernel had been compiled, which is the
      # most expensive place to find out.
      - name: The firmware tools
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/skd840n-firmware-venv"
          PY="$RUNNER_TEMP/skd840n-firmware-venv/bin/python"
          "$PY" -m pip install --quiet --disable-pip-version-check 'zopfli==0.4.3' 'PyYAML==6.0.3'
          echo "SKD840N_HOST_PYTHON=$PY" >> "$GITHUB_ENV"
          # Assert the two things the image stage depends on: the binding
          # is importable, and the script the image profile runs imports
          # cleanly under this interpreter.  The import in mkgzip.py is at
          # module level, so loading the module is the assertion.
          "$PY" -c 'import zopfli.gzip; assert zopfli.gzip.compress(b"x"); print("zopfli is here")'
          "$PY" -c 'import importlib.util; spec = importlib.util.spec_from_file_location("mkgzip", "tools/mkgzip.py"); module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module); print("mkgzip.py imports cleanly")'
          grep -qx "SKD840N_HOST_PYTHON=$PY" "$GITHUB_ENV" || {
            echo "::error::SKD840N_HOST_PYTHON did not reach the build"; exit 1; }

      # The OMCI engine is a Rust package: overlays/package/libs/libzxpon-omci
      # builds it with cargo for aarch64-unknown-linux-musl.  The 6.18 line
      # installs the toolchain in its own step; this line had none, so
      # ZX_CARGO stayed empty, the package's Build/Compile ran "cargo build"
      # with no cargo to run it, and the whole build died at the end of the
      # Compile step with
      #   ERROR: package/libs/libzxpon-omci failed to build.
      # That is what runs 1 to 13 of this line reported, and the kernel was
      # never the thing that failed.
      #
      # The assertions are the point of the step: without them the missing
      # toolchain is only noticed fifty minutes later, in a package log
      # nobody can read.
      - name: Rust 1.96.1 for the OMCI engine
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup target add --toolchain 1.96.1 aarch64-unknown-linux-musl
          ZX_CARGO="$(rustup which --toolchain 1.96.1 cargo)"
          if [ ! -x "$ZX_CARGO" ]; then
            echo "::error::no cargo at $ZX_CARGO"; exit 1
          fi
          if [ ! -x "$(dirname "$ZX_CARGO")/rustc" ]; then
            echo "::error::no rustc next to $ZX_CARGO"; exit 1
          fi
          if ! rustup target list --toolchain 1.96.1 --installed \
              | grep -qx aarch64-unknown-linux-musl; then
            echo "::error::the aarch64-unknown-linux-musl target is not installed"; exit 1
          fi
          "$ZX_CARGO" --version
          echo "ZX_CARGO=$ZX_CARGO" >> "$GITHUB_ENV"

      - name: Clone the OpenWrt tree
        run: |
          git clone --depth 1 -b "$IW_BRANCH" "$IW_URL" openwrt
          git -C openwrt fetch --depth 1 origin "$IW_SHA"
          git -C openwrt checkout --detach "$IW_SHA"
          test "$(git -C openwrt rev-parse HEAD)" = "$IW_SHA"
          test -d openwrt/target/linux/zte/patches-7.3
          test -f openwrt/target/linux/generic/kernel-7.3
          test -f openwrt/target/linux/zte/zx279133/config-7.3

      # The step the 6.18 line does not have.  It replaces the kernel fork
      # with a vanilla tarball plus a pinned patch series, and it is the only
      # place the 7.3 driver comes from.
      - name: Prepare the Linux 7.3.4 tree
        run: |
          python3 tools/prepare-sk-kernel-73.py \
            --tree "$KERNEL_TREE" \
            --version "$KVER" \
            --openwrt openwrt \
            --report kernel-provenance-73.json
          test "$(make -s -C "$KERNEL_TREE" kernelversion)" = "$KVER"
          cat kernel-provenance-73.json

      # The board layer is the only code in this repository that is new on the
      # 7.3 line: cnjn's driver set has no Unim NAND driver and no SK-D840N
      # device tree, so these files are ours and they have to fit the tree.
      # Nothing on the machine that pushes this repository can compile them -
      # there is no aarch64 cross toolchain there - so the kernel API they
      # use is checked here instead, before the seventy-minute Compile.
      #
      # pre  runs on the tree before the overlay goes in: it checks that every
      #      macro, type and accessor the new files use exists in the tree,
      #      and records cnjn's own DSA header values as the baseline.
      # post runs on the tree after the overlay went in: it checks that the
      #      board files landed, that the device tree resolves, and that the
      #      header the tagger now sees still defines every macro the tagger
      #      uses - and it compares the values against the baseline, because a
      #      changed macro value changes what the tagger accepts at runtime
      #      and a green compile cannot tell that apart.
      - name: Check the board layer against the 7.3 tree
        run: |
          python3 tools/check-sk-board-api.py pre \
            --tree "$KERNEL_TREE" --report sk-board-api.json

      - name: Apply the board layer
        run: |
          sh tools/apply-sk-overlay-73.sh "$KERNEL_TREE"

      - name: Check the applied board layer
        run: |
          python3 tools/check-sk-board-api.py post \
            --tree "$KERNEL_TREE" --report sk-board-api.json

      # The 9132 LAN switch driver is this repository's own code in the 7.3
      # tree, and it cannot be compiled on the machine that pushes this
      # repository either.  So the things a compiler would say about it are
      # checked here instead: every name it uses has to be defined, every
      # kernel function it calls has to exist, the LAN service it talks to
      # has to provide the operations it calls - including the control
      # transaction that patch 130 adds - and the Kconfig symbol, the
      # Makefile object and the device tree node have to line up.
      - name: Check the 9132 switch driver against the 7.3 tree
        run: |
          python3 tools/check-sk-switch-api.py \
            --tree "$KERNEL_TREE" --repo "$GITHUB_WORKSPACE"

      # The PON / OMCI stack is this repository's own code in the 7.3 tree
      # as well, and it cannot be compiled here either.  What is checked
      # instead: the protocol core is closed, every kernel name the stack
      # calls is visible in the file's own include closure, the tree's eth
      # structure carries the fields the stack uses, the four hooks - the
      # attach, the stop, the carrier kick and the management queue's
      # prepare - are where the tree expects them, the three objects are in
      # the NPU module, and the LED class the new code needs is on.
      - name: Check the PON / OMCI stack against the 7.3 tree
        run: |
          python3 tools/check-sk-pon-api.py \
            --tree "$KERNEL_TREE" --repo "$GITHUB_WORKSPACE" \
            --openwrt openwrt

      # The 9132's own programming is this repository's own code in the 7.3
      # tree as well, and it cannot be compiled here either.  What is checked
      # instead: the programming is in the tree's np.c, the ERAM table
      # bookkeeping is there and the SE allocator records the descriptors it
      # hands out, every name the block uses is defined, every kernel
      # function it calls exists, nothing is defined twice in np.c or idm.c,
      # the prepare function runs the programming in the right order, and the
      # board device tree names the MDIO bus the PHY enable looks for.
      - name: Check the 9132 switch programming against the 7.3 tree
        run: |
          python3 tools/check-sk-9132-api.py \
            --tree "$KERNEL_TREE" --repo "$GITHUB_WORKSPACE"

      # The conduit netdev is the DSA CPU port: it is the interface every RX
      # count of this board is read from, and the bench scripts and the
      # runbook look it up under one name.  The driver seeds the name with a
      # format string - strscpy() is a copy, not a formatter - and the kernel
      # resolves the unit id when the netdev is registered, so the published
      # name has to be resolved the kernel's way and not grepped for.  A name
      # the kernel would refuse leaves the board with no conduit at all; a
      # name it would publish differently makes the runbook read an interface
      # that does not exist, and the counters come back empty.
      - name: Check the conduit netdev name against the 7.3 tree
        run: |
          DRV="$KERNEL_TREE/drivers/net/ethernet/zte/zx279133-lan-conduit.c"
          if [ ! -f "$DRV" ]; then
            echo "::error::$DRV is gone - the 7.3 series no longer creates the conduit driver"
            exit 1
          fi
          python3 tools/check-conduit-netdev-name.py --source "$DRV"

      - name: Apply the OpenWrt-side overlays
        run: |
          cp -a overlays/. openwrt/
          # overlays-73/ holds the files that differ between the kernel
          # lines on the OpenWrt side: the zte target itself and the
          # subtarget defaults.
          cp -a overlays-73/. openwrt/
          test -f openwrt/target/linux/zte/image/Makefile
          grep -q 'Device/skyworth_sk-d840n' openwrt/target/linux/zte/image/Makefile
          grep -q 'KERNEL_PATCHVER:=7.3' openwrt/target/linux/zte/Makefile
          # The subtarget defaults have to clear OpenWrt's tweak list.
          # include/target.mk seeds it with "luci", the LuCI metapackage,
          # and the metapackage pulls luci-light, which depends on
          # luci-theme-bootstrap - so keeping the list would leave the
          # resolved config with Bootstrap next to Argon and the theme
          # check would refuse it.  Run 45012472909 is that failure.
          test -f openwrt/target/linux/zte/zx279133/target.mk
          grep -qx 'DEFAULT_PACKAGES.tweak:=' openwrt/target/linux/zte/zx279133/target.mk
          grep -q 'luci-theme-argon' openwrt/target/linux/zte/zx279133/target.mk
          # The libbpf fix for the 7.3 kernel's arm64 uapi headers has to be
          # in the tree.  Without it the build dies in package/libs/libbpf with
          #
          #   staging_dir/toolchain-.../include/asm/ptrace.h:96:9:
          #       error: unknown type name '__u128'; did you mean '__u32'?
          #
          # which is run 45107547379, job 137472302996: the 7.3.4 arm64
          # asm/ptrace.h uses __u128, and the copy of linux/types.h that
          # libbpf actually compiles against - its own, because its
          # -I../include comes first - does not define it.  The 6.18 line
          # spells the same fields __uint128_t and needs no such fix.
          #
          # The __attribute_const__ line in that patch is a guarded fallback,
          # not what the CI failed on: the kernel strips that macro out of
          # every header it exports (scripts/headers_install.sh:34), so the
          # diagnostic pass reported only the six __u128 errors.  It is
          # checked anyway because the shadowing is libbpf's, and it must
          # not depend on the kernel continuing to strip the macro.
          #
          # The three checks read the patch itself, not a phrase about it.
          LIBBPF_PATCH=openwrt/package/libs/libbpf/patches/110-arm64-u128-types.patch
          test -f "$LIBBPF_PATCH" || {
            echo "::error::$LIBBPF_PATCH is missing - the libbpf fix did not land"; exit 1; }
          grep -qx '+++ b/include/linux/types.h' "$LIBBPF_PATCH" || {
            echo "::error::$LIBBPF_PATCH does not patch libbpf's include/linux/types.h"; exit 1; }
          grep -qx '+typedef unsigned __int128 __u128 __attribute__((aligned(16)));' "$LIBBPF_PATCH" || {
            echo "::error::$LIBBPF_PATCH does not define __u128"; exit 1; }
          grep -qx '+#define __attribute_const__ __attribute__((__const__))' "$LIBBPF_PATCH" || {
            echo "::error::$LIBBPF_PATCH does not define __attribute_const__"; exit 1; }

      # The 7.3 fragments are named config-7.3, not config-6.18.  This is the
      # same edit the 6.18 line makes, with the other file names: a fragment
      # that still says "not set" anywhere under target/linux outranks the
      # pin, and the merged result is what decides the outcome.
      - name: Enable /dev/mem in the 7.3 fragments
        run: |
          DEVMEM_OFF='# CONFIG_DEVMEM is not set'
          for f in openwrt/target/linux/generic/config-7.3 \
                   openwrt/target/linux/zte/config-7.3 \
                   openwrt/target/linux/zte/zx279133/config-7.3; do
            if [ -f "$f" ]; then
              sed -i "s|^${DEVMEM_OFF}\$|CONFIG_DEVMEM=y|" "$f"
              if grep -qxF "$DEVMEM_OFF" "$f"; then
                echo "::error::$f still disables CONFIG_DEVMEM after the edit"; exit 1
              fi
              echo "  $f -> $(grep -cx 'CONFIG_DEVMEM=y' "$f") CONFIG_DEVMEM=y line(s)"
            fi
          done
          LEFT=$(grep -rl -x "$DEVMEM_OFF" openwrt/target/linux/generic/config-7.3 \
                 openwrt/target/linux/zte/config-7.3 openwrt/target/linux/zte/zx279133/config-7.3 2>/dev/null || true)
          if [ -n "$LEFT" ]; then
            echo "::error::a fragment still disables CONFIG_DEVMEM: $LEFT"; exit 1
          fi
          SUBCFG=openwrt/target/linux/zte/zx279133/config-7.3
          if [ ! -f "$SUBCFG" ] || ! grep -qx 'CONFIG_DEVMEM=y' "$SUBCFG"; then
            echo "::error::no CONFIG_DEVMEM=y in $SUBCFG, the fragment merged last"; exit 1
          fi

      # The zte drivers have to be built into the kernel, not into modules.
      #
      # cnjn's config-7.3 carries CONFIG_ZTE_ZX279133_ETH=m, because the
      # reference firmware loads npu.ko from /etc/modules-boot.d.  That file
      # is in the firmware this repository reverse engineered, and it says
      # exactly what the vendor's image does:
      #   etc/modules.d/30-zte-npu       "npu vlan_offload=1"
      #   etc/modules-boot.d/30-zte-npu  -> ../modules.d/30-zte-npu
      #   etc/modules.d/32-zte-npu-pon   "npu-pon"
      #   etc/modules.d/42-zte-fnoffload "fnoffload vlan_offload=1"
      # Nothing here has that loader.  There is no kmod package for these
      # modules, and OpenWrt does not put an in-tree module into the rootfs
      # unless a kmod-* package declares it - so with =m the 7.3 image would
      # come up with no NPU in it at all, and nothing in it would ever load
      # one.
      #
      # The dependency makes it worse than a missing module.  kconfig clamps
      # a tristate symbol whose dependency is modular to =m:
      # scripts/kconfig/symbol.c:471-474 takes EXPR_AND of the requested
      # value with the symbol's visibility, and a symbol that depends on a
      # modular one is visible as "mod", not "yes".  So the
      # CONFIG_ZTE_ZX279133_SWITCH=y that scripts/configure-sk-d840n.sh pins
      # is silently demoted to =m while CONFIG_ZTE_ZX279133_ETH=m - and the
      # board's own device tree names the 9132 switch node
      # (compatible = "zte,zx279133-switch"), which a module can never bind,
      # because nothing loads it.
      #
      # The 6.18 release line has this arrangement already, and the running
      # image confirms it: docs/07 records "CONFIG_ZTE_ZX279133_ETH=y  <--
      # 网卡驱动内建" out of that board's /proc/config.gz, with no .ko files
      # under /lib/modules at all.  These three pins put the 7.3 line on the
      # same footing.
      #
      # The fourth symbol is the flow offload driver.  cnjn's 7.3 tree
      # splits it out of the NPU driver into its own fnoffload.o, while the
      # 6.18 tree keeps it inside the composite - so on the 6.18 line it is
      # built in, and on the 7.3 line it would be a module that never gets
      # installed.  Its own dependency, NF_FLOW_TABLE, is pinned built-in
      # by configs/sk-d840n-offload.config during the Configure step, so =y
      # is reachable; without the driver that whole netfilter profile would
      # be in the kernel for nothing.
      #
      # Putting all four in one image cannot collide: the offload, switch
      # and conduit objects define no global symbol at all (every function
      # in them is static), so the only global names in the image come from
      # the NPU driver's own objects.
      - name: Build the zte drivers into the kernel
        run: |
          set -e
          DRVCFG=openwrt/target/linux/zte/zx279133/config-7.3
          [ -f "$DRVCFG" ] || {
            echo "::error::$DRVCFG is gone - the clone's layout changed"; exit 1; }
          for sym in ZTE_ZX279133_ETH ZTE_ZX279133_LAN_CONDUIT ZTE_ZX279133_SWITCH \
                     ZTE_ZX279133_FNOFFLOAD; do
            if grep -q "^CONFIG_${sym}=" "$DRVCFG"; then
              sed -i "s|^CONFIG_${sym}=.*|CONFIG_${sym}=y|" "$DRVCFG"
            elif grep -q "^# CONFIG_${sym} is not set\$" "$DRVCFG"; then
              sed -i "s|^# CONFIG_${sym} is not set\$|CONFIG_${sym}=y|" "$DRVCFG"
            else
              printf 'CONFIG_%s=y\n' "$sym" >>"$DRVCFG"
            fi
            grep -qx "CONFIG_${sym}=y" "$DRVCFG" || {
              echo "::error::could not pin CONFIG_${sym}=y in $DRVCFG"; exit 1; }
          done
          grep -E '^CONFIG_ZTE_ZX279133' "$DRVCFG" || true

      # The host's compiler, on the tree that is about to be built.
      #
      # The Compile step is seventy minutes long, and it builds the packages
      # before it builds the kernel, so a syntax error in the drivers this
      # repository owns is found very late - in runs #14 to #18 it was found
      # in a package log, and the kernel was never reached at all.  This step
      # asks the host's clang to parse the same files, on the same tree,
      # with the same configuration fragments, in about a minute.
      #
      # What it reads is what the build will read: the generated headers the
      # tree's own tools produce (not an approximation of them), the arch's
      # own generated headers, and the shadow headers for the anonymous
      # members clang does not accept.  The configuration is the OpenWrt
      # tree's own fragments, after the /dev/mem edit and after the =y pins
      # above, so the driver is parsed the way it will be compiled.
      #
      # The file list is not written by hand: it is the set of .c files
      # this repository's own patch series touches, plus the .c files the
      # board layer adds.  The contract test compares the list in this step
      # with that set, so a new patch that touches another driver cannot
      # slip past the check.
      #
      # The verdict is about our files.  An error the compiler reports in
      # one of the tree's own headers means the compiler could not read the
      # tree - the runner's clang is older than the kernel it is reading -
      # and then the errors in our files may be a consequence of that rather
      # than a mistake of ours.  The tool says so and does not fail on them.
      - name: Check the drivers with the host compiler
        run: |
          set -e
          python3 tools/kcheck.py \
            --tree "$KERNEL_TREE" \
            --config openwrt/target/linux/generic/config-7.3 \
            --config openwrt/target/linux/zte/config-7.3 \
            --config openwrt/target/linux/zte/zx279133/config-7.3 \
            --file drivers/net/ethernet/zte/zx279133-idm.c \
            --file drivers/net/ethernet/zte/zx279133-mac.c \
            --file drivers/net/ethernet/zte/zx279133-main.c \
            --file drivers/net/ethernet/zte/zx279133-netdev.c \
            --file drivers/net/ethernet/zte/zx279133-np.c \
            --file drivers/net/ethernet/zte/zx279133-omci.c \
            --file drivers/net/ethernet/zte/zx279133-pon.c \
            --file drivers/net/ethernet/zte/zx279133-switch.c \
            --file drivers/net/ethernet/zte/zxpon.c \
            --gen "$RUNNER_TEMP/kcheck-73"

      # The gate that reads the machine code of the conduit's open runs at the
      # end of the flash job, where the linked kernel and the image are.  Its
      # own logic - reading a symbol table, reading the compiler's line table,
      # finding the two things and comparing them - is checked here instead,
      # on a kernel built for the purpose, so that a broken gate is reported
      # in minutes rather than after an hour of compiling.
      #
      # It needs the tree, because the two source lines it asks about are
      # found in the driver's source: so it runs here, right after the tree
      # is prepared, and not in the gates job - which has no tree.
      - name: Check the machine-code gate on a kernel built for the purpose
        run: |
          set -e
          python3 tests/test_sk_kernel_order_local.py --tree "$KERNEL_TREE"

      # The 7.3 tree's driver believed the TX completion counter.  When the
      # counter reported more completions than the ring had frames in it, it
      # clamped the delta and released the slots - and a counter that cannot
      # be trusted cannot prove that the DMA has given the buffers back.
      # The 6.18 generation quarantines the ring instead; the 160 patch moves
      # that model into this tree, and this gate says the move really
      # happened - in the tree that is about to be compiled, not in a
      # synthetic copy of it.
      #
      # The controls run on the same tree: a synthetic driver would only
      # prove that the gate reads a synthetic driver.
      - name: 'Gate: a TX ring with an untrusted counter is quarantined'
        run: |
          set -e
          python3 tools/check-sk-tx-isolation.py --tree "$KERNEL_TREE"
          python3 tests/test_sk_tx_isolation.py --tree "$KERNEL_TREE"

      # The 160 patch counts what the isolation did - how often a completion
      # counter could not be trusted, how often a recovery was asked for, how
      # often the shared datapath was restarted, how often the recovery
      # failed - and the tree reads none of it.  A board whose ring was
      # quarantined then looks exactly like a board that never had a
      # problem, which is the question the isolation exists to answer.  The
      # 180 patch publishes the four through the ethtool statistics table,
      # and this gate says they really are there: the enum, the name table
      # and the assignments have to agree on where each counter is, and
      # nothing in the build notices when they do not.
      #
      # The controls run on the same tree, and each of them has to turn the
      # gate red on the check that names the list it broke.
      - name: 'Gate: the TX isolation counters are published'
        run: |
          set -e
          python3 tools/check-sk-tx-isolation-stats.py --tree "$KERNEL_TREE"
          python3 tests/test_sk_tx_isolation_stats.py --tree "$KERNEL_TREE"

      # A datapath that could not be brought up is marked failed, and the
      # board has to have a way back from that.  The 6.18 generation had
      # one: the conduit's open restored a failed datapath.  The tree
      # without it has only two paths, and both need a second user to
      # already be there - so a board with one interface up had no way
      # back at all.  The 190 patch puts the 6.18 generation's restore
      # back, and this gate says it is really there - and, more than
      # that, that it comes *before* the check for the hardware, because
      # a datapath that failed leaves the hardware unprepared and a check
      # in front of the restore would refuse the open before any restore
      # could run.
      #
      # The controls run on the same tree, and each of them has to turn
      # the gate red on the check that names what it broke.
      - name: 'Gate: a failed datapath has a way back'
        run: |
          set -e
          python3 tools/check-sk-datapath-restore.py --tree "$KERNEL_TREE"
          python3 tests/test_sk_datapath_restore.py --tree "$KERNEL_TREE"

      # The 7.3 tree's receive path handed frames to the stack on the
      # strength of what the descriptor said.  The L2 rewrite ran on frames
      # that carry an Ethernet type field, which shifts the IP header four
      # bytes to the right and drops every IPv4 and IPv6 frame; the delivery
      # path read the frame as an Ethernet header without asking how long it
      # was; an XDP program could leave the stack with a pointer outside the
      # buffer; and a buffer went back to the hardware without the
      # device-side synchronisation.  The 170 patch fixes those, and this
      # gate says the fix is really in the tree that is about to be
      # compiled - not in a synthetic copy of it.
      - name: 'Gate: the RX delivery path proves what it hands over'
        run: |
          set -e
          python3 tools/check-sk-rx-delivery.py --tree "$KERNEL_TREE"
          python3 tests/test_sk_rx_delivery.py --tree "$KERNEL_TREE"

      - name: Check the overlay for what a compiler would have caught
        run: |
          python3 tools/prepush.py "$GITHUB_WORKSPACE"

      # The 6.18 release line has this step and the 7.3 line did not, and the
      # difference was worth two Configure failures (runs 45009499015 and
      # 45010154919, both at "Argon is not built into the resolved SK-D840N
      # config").
      #
      # The reason is a file, not a package list: the Argon recipe ends with
      #   include $(TOPDIR)/feeds/luci/luci.mk
      # (jerrykuku/luci-theme-argon Makefile:54).  Without the luci feed there
      # is no luci.mk, so the recipe cannot be parsed, so the package never
      # enters the package database, so defconfig drops
      # CONFIG_PACKAGE_luci-theme-argon=y in silence - the same way it drops
      # a config line for a symbol that does not exist.  The theme check then
      # reports it, which is the only reason the failure was legible at all.
      #
      # The feeds are also where luci-base comes from, and Argon depends on
      # it (LUCI_DEPENDS:=+luci-base ...), so the package could not have been
      # selected even with luci.mk present.
      # The 7.3 line had no download cache, and that is not a performance
      # question: it is a correctness one.
      #
      # The release line has had this cache for weeks, and the two lines
      # need the same packages - so the 6.18 line's cache holds packages the
      # 7.3 line needs as well.  One of them is libbpf, whose source is a
      # GIT clone:
      #
      #   package/libs/libbpf/Makefile
      #     PKG_SOURCE_PROTO:=git
      #     PKG_SOURCE_URL:=https://github.com/libbpf/libbpf
      #
      # libbpf is in the image because this repository's own iproute2
      # overlay puts "DEPENDS:=+libbpf" on the ip and tc packages - and
      # that overlay is used by both lines.
      #
      # The two lines do NOT build the same tree, and an earlier version of
      # this comment said they did.  They clone the same repository, but
      # different commits of it:
      #
      #   6.18 line  cnjn/ImmortalWrt  sr1010-zx279133  1b50aaf4
      #   7.3  line  cnjn/ImmortalWrt  master          31e2ac4d
      #
      # The difference is small - the two trees differ in 196 files - and
      # libbpf's own package definition is byte for byte the same in both
      # (package/libs/libbpf/Makefile: 1.6.2, the same PKG_MIRROR_HASH).
      # So the cached tarball is the right one for both.  The comment that
      # claimed the two lines share one commit was simply wrong, and it was
      # wrong in a way that mattered: it made the cache look like a copy of
      # one build's downloads when it is really a cache shared by two
      # different trees.
      #
      # What the cache does NOT fix is the build.  Run #14 (head 0af2270)
      # failed with "ERROR: package/libs/libbpf failed to build" while the
      # 6.18 line's run #364 at the very same commit succeeded, and the
      # conclusion drawn then was that the package builds here and only the
      # fetching failed.  Run #25 (head cb0f627) refuted that: with the
      # download working - the "Download packages" step passed - libbpf
      # still failed to build.  What it fails at is now the question the
      # Compile step asks, with a serial verbose pass over the package.
      #
      # With the cache, the 7.3 line restores the package instead of
      # cloning it from github on every run.  The cache is keyed the same
      # way as the release line's, so the two lines share it: the key
      # names the build mode and a hash of configs/ and overlays/, and
      # those are the same directories in both lines.
      - name: Cache dl/
        if: inputs.clean_cache != 'true'
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: skd840n-dl-${{ matrix.mode }}-${{ hashFiles('configs/*.config', 'overlays/**') }}
          restore-keys: skd840n-dl-

      - name: Install feeds
        working-directory: openwrt
        # A clone that stalls must fail, not wait: git has no default
        # timeout, and a feed that half-arrives leaves the build that
        # follows it waiting on a tree that never finishes arriving.
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 60
          GIT_TERMINAL_PROMPT: 0
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # The theme check runs against the resolved .config, so the feed
          # that carries it has to be there before Configure, not after.
          test -f feeds/luci/luci.mk
          test -f package/feeds/luci/luci-base/Makefile

      - name: Configure
        run: |
          set +e
          (
            set -e
            sh scripts/prepare-sk-d840n-ui.sh "$GITHUB_WORKSPACE/openwrt"
            sh scripts/configure-sk-d840n.sh \
              "$GITHUB_WORKSPACE/openwrt" \
              "$GITHUB_WORKSPACE/$KERNEL_TREE" \
              "${{ matrix.mode }}"
          ) 2>&1 | tee sk-configure.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" != 0 ]; then
            message=$(tail -n 65 sk-configure.log | python3 -c 'import sys; s=sys.stdin.read()[-2600:]; print(s.replace("%","%25").replace("\r","").replace("\n","%0A"))')
            echo "::error::$message"
            exit "$rc"
          fi
          set -e

      # The theme check refuses a config that carries more than one theme,
      # and the way Bootstrap got there was the tweak list: include/target.mk
      # seeds it with "luci", the metapackage, and the metapackage pulls
      # luci-light, which depends on luci-theme-bootstrap.  The 7.3 subtarget
      # defaults clear the list, so the metapackage must not be in the
      # resolved config - and if it is, the theme check passed for the wrong
      # reason and the image would ship both themes.
      - name: 'Gate: the resolved config carries exactly one theme'
        run: |
          cd openwrt
          if grep -q '^CONFIG_PACKAGE_luci=y' .config; then
            echo "::error::the LuCI metapackage is selected, so luci-light will pull luci-theme-bootstrap in"
            grep -E '^CONFIG_PACKAGE_luci(-theme-[a-z-]+)?=' .config || true
            exit 1
          fi
          echo "--- the themes in the resolved config ---"
          grep -E '^CONFIG_PACKAGE_luci-theme-' .config || true

      - name: Download packages
        working-directory: openwrt
        env:
          CURL_OPTIONS: --speed-limit 100 --speed-time 120
          WGET_OPTIONS: --read-timeout=120 --timeout=120
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile
        working-directory: openwrt
        # A build that fails has to say why, and the parallel pass cannot.
        #
        # OpenWrt's include/verbose.mk throws every sub-make's stdout AND
        # stderr away unless V=s is set:
        #
        #   SILENT:=>/dev/null $(if $(findstring w,$(OPENWRT_VERBOSE)),,2>&1)
        #   SUBMAKE=cmd() { $(SILENT) $(MAKE) -s "$$@" < /dev/null || { echo
        #     "make $$*: build failed. Please re-run make with -j1 V=s or V=sc
        #     for a higher verbosity level to see what's going on"; false; } }
        #
        # So compile.log holds the make chain and nothing else: the
        # compiler's words are never written down anywhere.  The 7.3 line's
        # run #25 (45040260008) is that case - it died in
        # package/libs/libbpf and the only thing that could be said about
        # it was "exit code 2".
        #
        # There is a second blindness next to it, and it is worse: OpenWrt
        # writes a per-package log under logs/ only when
        # CONFIG_BUILD_LOG=y, and this build does not set it.  So "there is
        # no logs/libbpf.txt" says nothing whatsoever about libbpf, and an
        # earlier version of this step reported it as if it did - as "the
        # package has no log of its own: it never got as far as being
        # compiled".  That sentence was ours, not OpenWrt's, and it was
        # wrong: the package was compiled and failed, and the reason was in
        # a stream that had been discarded.
        #
        # So the diagnostic is a second pass, over the one target that
        # failed, run serially and verbosely.  The 6.18 line has done this
        # since run 88, and it is what turns "exit code 2" into the
        # compiler's own sentence.
        run: |
          set -o pipefail
          rc=0
          timeout --kill-after=60s 280m bash -c 'make -j"$(nproc)"' 2>&1 | tee ../compile.log || rc=$?
          rc=${rc:-0}
          echo "::group::the tail of the build log"
          tail -n 200 ../compile.log
          echo "::endgroup::"
          if [ "$rc" != 0 ]; then
            # The job log of a run is not readable without a GitHub login,
            # but an annotation is: the annotations of a run are public.  So
            # the reason the build failed has to go into one.
            #
            # Which package failed is the first question, and OpenWrt
            # answers it itself:
            #
            #   ERROR: package/libs/libbpf failed to build.
            #
            # That line is in compile.log even in the silent mode, because
            # it is printed by the top level make and not by a sub-make.
            FAILED=$(sed -n 's/^[[:space:]]*ERROR:[[:space:]]*package\/\([^[:space:]]*\) failed to build\..*/\1/p' ../compile.log | head -n 1)
            # The kernel is not a package.  It is built by target/linux/compile
            # (include/target.mk pulls in kernel-build.mk when TARGET_BUILD=1,
            # and kernel-build.mk's compile target is what runs the kernel's
            # own make), so when it fails the top level says
            #
            #   ERROR: target/linux failed to build.
            #
            # The pattern above only knows package/<path>, so it does not
            # match that, and the pass would fall through to the whole tree.
            # The whole tree is a bad way to reach the kernel: it walks the
            # package order again from the top, and its ceiling expires long
            # before the kernel - the 6.18 line's runs 88, 89, 91 and 92 are
            # exactly that failure.  The 6.18 line asks for
            # target/linux/compile by name for the same reason.
            #
            # The line is matched as a fixed string, because OpenWrt prints it
            # with three leading spaces (the ERROR macro in include/subdir.mk
            # is called with the message indented) and a fixed string does not
            # care where in the line it sits.
            KERNEL_FAILED=no
            if grep -qaF 'ERROR: target/linux failed to build' ../compile.log; then
              KERNEL_FAILED=yes
            fi
            echo "the package that failed: ${FAILED:-unknown}"
            echo "the kernel that failed: ${KERNEL_FAILED}"
            DIAG=../compile-diag.log
            : > "$DIAG"
            # The diagnostic pass: the failed thing alone, serially, with
            # the sub-makes' output switched back on.  The objects of the
            # parallel pass are still on the disk, so this goes straight to
            # the file that broke and prints what the compiler said about
            # it.
            # The kernel is asked for first.  If the kernel is what broke,
            # the package that failed is a consequence of it, and a package
            # pass would spend its whole ceiling on the consequence.
            if [ "$KERNEL_FAILED" = yes ]; then
              timeout --kill-after=60s 25m bash -c "make -j1 V=s target/linux/compile" 2>&1 | tee "$DIAG" || true
            elif [ -n "$FAILED" ]; then
              # The target is package/<path>/compile, and the "package/" is not
              # optional.  The top level has no rule for <path>/compile: it
              # falls into toplevel.mk's catch-all (%::), whose sub-make then
              # says "No rule to make target '<path>/compile'.  Stop."  Run
              # 33's diagnostic pass asked for the bare path, got exactly that
              # message, and the compiler's own words never came out - the
              # pass reported the absence of a rule instead of the reason.
              timeout --kill-after=60s 20m bash -c "make -j1 V=s package/${FAILED}/compile" 2>&1 | tee "$DIAG" || true
            fi
            # A pass that named no error has not found one: the failure was
            # somewhere else, and the whole tree gets the same treatment,
            # with the ceiling it always had.
            #
            # "No rule to make target" counts as no error named: it means the
            # pass never reached the package at all.  "Error 2" on its own is
            # only make's way of saying the recipe failed, and it used to
            # satisfy the pattern below, which is why run 33's pass never
            # fell through to the whole tree.
            if ! grep -qaE "fatal error:|\berror:|undefined symbol|implicit declaration|No such file|build failed" "$DIAG" \
               || grep -qa "No rule to make target" "$DIAG"; then
              echo "::notice::the package pass named no error - looking at the whole tree"
              timeout --kill-after=60s 20m bash -c "make -j1 V=s" 2>&1 | tee -a "$DIAG" || true
            fi
            {
              # The compiler's own message comes FIRST in the log and the
              # make chain comes LAST, so a tail keeps the chain and throws
              # the reason away.  The pattern carries the capital "Error"
              # too: the compiler says "error:" and make says "Error 1",
              # and a pattern that only knows the lower case misses half of
              # what is in there.  "build failed" is OpenWrt's own hint,
              # and it is the one line the silent mode does leave behind.
              grep -naE "fatal error:|\berror:|Error [0-9]+|No such file|undefined reference|undefined symbol|not defined|implicit declaration|build failed" "$DIAG" | head -n 12 || true
              echo "--- and the make chain ---"
              grep -naE "Error [0-9]+$|make.*\*\*\*" "$DIAG" | tail -n 8 || true
            } | while IFS= read -r line; do
              echo "::error::diag: $(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/#/%23/g' | tr -d '\r')"
            done
            {
              echo "### the compiler's own message"
              echo
              echo '```'
              echo "the package that failed: ${FAILED:-unknown}"
              head -n 200 "$DIAG"
              echo '```'
              echo
              echo "### the tail of the parallel pass's log"
              echo
              echo '```'
              tail -n 40 ../compile.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      # The pins above are an intention; the merged kernel config is the
      # result.  A symbol that does not exist in the tree, and a tristate
      # symbol whose dependency is modular, are both dropped in silence -
      # and the image that comes out of that has no NPU in it, which looks
      # exactly like a board that does not boot.  So the three symbols are
      # checked against the kernel's own .config, the way the 6.18 line
      # checks its PHY and its netfilter set.
      - name: 'Gate: the zte drivers are built into the kernel'
        run: |
          set -e
          KC=$( { ls -d openwrt/build_dir/target-*/linux-*/linux-$KVER/.config 2>/dev/null || true; } | head -1 )
          if [ -z "$KC" ] && [ -f "$KERNEL_TREE/.config" ]; then
            KC="$KERNEL_TREE/.config"
          fi
          [ -n "$KC" ] || {
            echo "::error::no merged kernel .config for linux-$KVER; what is there:"
            ls -d openwrt/build_dir/target-*/linux-* 2>&1 || true
            ls -l "$KERNEL_TREE/.config" 2>&1 || true
            exit 1; }
          echo "kernel config: $KC"
          for s in ZTE_ZX279133_ETH ZTE_ZX279133_LAN_CONDUIT ZTE_ZX279133_SWITCH \
                   ZTE_ZX279133_FNOFFLOAD; do
            grep -qx "CONFIG_$s=y" "$KC" || {
              echo "::error::CONFIG_$s is not built into the kernel" >&2
              { grep -E "^CONFIG_${s}=|^# CONFIG_${s} is not set" "$KC" \
                  || echo "    CONFIG_$s is absent from the merged config"; } >&2
              grep -iE '^CONFIG_(ZTE_ZX279133|NET_DSA|PCS_XPCS|LEDS_CLASS|PHY_ZX279133)' "$KC" >&2 || true
              exit 1; }
          done
          grep -iE '^CONFIG_(ZTE_ZX279133|NET_DSA_TAG_ZX279133)' "$KC" || true

      # The release line has a gate that reads the merged kernel .config of
      # the kernel it actually ships and asserts that the board's
      # requirements are in it.  The 7.3 line had only the four zte driver
      # symbols, so a configuration that lost the Realtek PHY, the netfilter
      # family, the panic timeout or the built-in command line would have
      # produced an image that builds cleanly and does not work - and the
      # failure would only show up on the board, as "no network port" or as
      # a boot that waits forever for a root device this board never makes.
      #
      # Every symbol is checked against the merged .config, never against
      # the fragment that was edited: a symbol that does not exist in the
      # tree, and a tristate symbol whose dependency is modular, are both
      # dropped in silence - kconfig takes the AND of the requested value
      # with the symbol's visibility (scripts/kconfig/symbol.c), so a
      # fragment can say =y while the kernel says =m.
      #
      # The list is the release line's, and it was checked against the 7.3
      # tree before it was copied here: all 39 symbols exist in a 7.3 tree,
      # all 39 come out =y out of the three config-7.3 fragments plus the
      # offload profile, and no symbol in any of their dependency chains is
      # modular - so none of them can be clamped back to =m.  The chain was
      # walked with the tree's own Kconfig files, not by reading the
      # fragments, because that is the only place a clamp can happen.
      - name: 'Gate: the merged kernel config carries the board requirements'
        run: |
          set -e
          KC=$( { ls -d openwrt/build_dir/target-*/linux-*/linux-$KVER/.config 2>/dev/null || true; } | head -1 )
          [ -n "$KC" ] || {
            echo "::error::no merged kernel .config for linux-$KVER; what is there:"
            ls -d openwrt/build_dir/target-*/linux-* 2>&1 || true
            exit 1; }
          echo "kernel config: $KC"
          # What the failing symbol actually *is* is the whole question, and
          # it has four different answers that look identical from the
          # outside: =y (it is not, since we are in the failure branch), =m,
          # an explicit "# ... is not set", or absent from .config altogether -
          # and the last one means the symbol name does not exist in this
          # kernel's Kconfig, which defconfig then drops without a word.
          dump_config_state() {
            for k in "$@"; do
              if grep -qx "CONFIG_$k=y" "$KC"; then
                printf '    %-34s =y\n' "CONFIG_$k"
              elif v=$(grep -m1 -E "^(CONFIG_$k=|# CONFIG_$k is not set$)" "$KC"); then
                printf '    %s\n' "$v"
              else
                printf '    %-34s <not mentioned in .config at all>\n' "CONFIG_$k"
              fi
            done
          }
          # required: without these the board cannot be reached, read, or
          # routed at all, and a missing one looks exactly like "the kernel
          # does not boot".
          required="CC_OPTIMIZE_FOR_SIZE REALTEK_PHY LEDS_GPIO GPIO_ZX279133 GPIO_SYSFS PSTORE PSTORE_CONSOLE PSTORE_RAM MAGIC_SYSRQ MAGIC_SYSRQ_SERIAL DYNAMIC_DEBUG DYNAMIC_DEBUG_CORE NETFILTER NF_CONNTRACK NF_CONNTRACK_MARK NF_NAT NF_TABLES NF_TABLES_INET NF_TABLES_IPV4 NF_TABLES_IPV6 NFT_CT NFT_NAT NFT_MASQ NFT_REDIR NFT_REJECT NFT_REJECT_INET NFT_REJECT_IPV4 NFT_REJECT_IPV6 NFT_FIB NFT_FIB_INET NFT_FIB_IPV4 NFT_FIB_IPV6 NFT_LOG NFT_LIMIT NFT_QUOTA NFT_NUMGEN NF_FLOW_TABLE NF_FLOW_TABLE_INET NFT_FLOW_OFFLOAD"
          # reported: bring-up instruments.  Worth having, never worth a red
          # run - the pin is still attempted, only the blocking is dropped,
          # and the state is published either way, so nothing is hidden.
          reported="DEVMEM STRICT_DEVMEM IO_STRICT_DEVMEM DETECT_HUNG_TASK SOFTLOCKUP_DETECTOR IKCONFIG IKCONFIG_PROC VETH"
          for s in $required; do
            grep -qx "CONFIG_$s=y" "$KC" || {
              echo "::error::CONFIG_$s is not built into the kernel" >&2
              echo "    config file: $KC" >&2
              echo "    --- the failing symbol, on its own ---" >&2
              dump_config_state "$s" >&2
              echo "    --- every symbol this gate asserts, as it actually stands ---" >&2
              dump_config_state $required >&2
              exit 1; }
          done
          # -Os keeps every selected feature while fitting the fixed kernel
          # partition; check the merged config, not just the two inputs
          # configure pinned.
          grep -qx '# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE is not set' "$KC" || {
            echo "::error::kernel optimization reverted to -O2" >&2
            dump_config_state CC_OPTIMIZE_FOR_SIZE CC_OPTIMIZE_FOR_PERFORMANCE >&2
            exit 1; }
          # CONFIG_PANIC_TIMEOUT=1 (cnjn's generic config) means a panic
          # prints and then reboots one second later.  Zero leaves the
          # message on the console forever, which is the difference between
          # "the kernel said why" and "the board is cycling".
          grep -qx 'CONFIG_PANIC_TIMEOUT=0' "$KC" || {
            echo "::error::CONFIG_PANIC_TIMEOUT is not 0 - a panic would reboot before the console could be read" >&2
            dump_config_state PANIC_TIMEOUT >&2
            exit 1; }
          # The built-in command line is the reason the last image waited
          # forever for a root device this board never creates: SR1010's
          # flash layout is not ours, and root is mtdblock5 here.
          grep -qx 'CONFIG_CMDLINE="console=ttyAMA0,115200n8 root=/dev/mtdblock5 rootfstype=jffs2 ro rootwait clk_ignore_unused pd_ignore_unused"' "$KC" || {
            echo "::error::CONFIG_CMDLINE is not the pinned cmdline" >&2
            grep -iE '^CONFIG_CMDLINE' "$KC" >&2 || echo "no CONFIG_CMDLINE at all" >&2
            exit 1; }
          ! grep -q 'mtdblock7' "$KC" || {
            echo "::error::a mtdblock7 cmdline is still in the kernel config" >&2
            exit 1; }
          for s in $reported; do
            st=$( { grep -m1 -E "^(CONFIG_$s=|# CONFIG_$s is not set$)" "$KC"; } || true )
            [ -n "$st" ] || st="CONFIG_$s absent from .config - no such symbol, or a dependency turned it off"
            echo "::warning::$st"
          done
          grep -iE '^CONFIG_(ZTE_ZX279133|REALTEK|MDIO_ZX|NETFILTER)' "$KC" || true

      # A device tree node whose "compatible" names a driver that was not
      # built is SKIPPED SILENTLY by the kernel: the board boots, logs
      # nothing wrong, and simply has no network port.  The release line has
      # a gate for that; the 7.3 line had none, and the 7.3 tree is where
      # the switch driver, the PON stack and the 9132 programming are our
      # own code.
      #
      # What is asked here is not "is the driver in the tree" but "is the
      # driver in the kernel that was built": a compatible string is in the
      # image only when the driver that registers it was compiled in, and a
      # driver built as a module puts its string into the .ko instead.  So
      # this is also the check that would catch a driver of ours going back
      # to being a module - the mistake this line already made once, when
      # the NPU driver was "=m" and the image had no NPU in it at all.
      #
      # The gate is not the release line's awk program copied: it is a tool
      # of this repository's own, because the release line's version would
      # go red on the 7.3 tree over one node - the RGMII register window,
      # which has a read-only probe in the 6.18 tree and deliberately has no
      # driver in the 7.3 one (docs/101 八之五.9: a trade-off, not a gap).
      # That node is carried as an exception with its reason, and the tool
      # prints the exception rather than passing over it in silence.
      - name: 'Gate: every compatible the device tree names has a driver'
        run: |
          set -e
          KT=$( { ls -d openwrt/build_dir/target-*/linux-*/linux-$KVER 2>/dev/null || true; } | head -1 )
          [ -n "$KT" ] || KT="$KERNEL_TREE"
          IMG=""
          for candidate in "$KT/arch/arm64/boot/Image" \
                            "$KERNEL_TREE/arch/arm64/boot/Image"; do
            [ -f "$candidate" ] && IMG="$candidate" && break
          done
          [ -n "$IMG" ] || {
            echo "::error::no built kernel image for linux-$KVER; what is there:"
            ls -l "$KT/arch/arm64/boot/" 2>&1 || true
            exit 1; }
          DTS=""
          for candidate in "$KT/arch/arm64/boot/dts/zte/zx279133-sk-d840n.dts" \
                            "$KERNEL_TREE/arch/arm64/boot/dts/zte/zx279133-sk-d840n.dts"; do
            [ -f "$candidate" ] && DTS="$candidate" && break
          done
          [ -n "$DTS" ] || {
            echo "::error::no board device tree for linux-$KVER; what is there:"
            ls -l "$KT/arch/arm64/boot/dts/zte/" 2>&1 || true
            exit 1; }
          echo "kernel image: $IMG"
          echo "device tree:  $DTS"
          python3 tools/check-sk-dtb-compat.py --dts "$DTS" --image "$IMG"

      # The bring-up line's whole purpose is an image to put on the board,
      # and until the images are collected there is nothing to flash.  The
      # build has already made them under bin/targets - this step does not
      # build a second image and does not re-compress anything: it collects
      # what the build produced and reports the sizes.
      #
      # The kernel size is the one number that can stop the flash job: this
      # board's device tree says "kernel 8192k@0x200000", so the gzip
      # uImage has to fit in 8 MiB.  The image profile carries
      # "KERNEL_SIZE := 8192k", so OpenWrt's image.mk already refuses to
      # build one that does not fit - reaching this step means it fits.  The
      # number is printed anyway, because "the image was built" and "the
      # image fits" are two questions and only one of them was asked before.
      # The NPU driver is now inside the kernel image (see the pin step
      # above), so this number grew with it.
      - name: Collect the images
        run: |
          set -e
          BIN=openwrt/bin/targets/zte/zx279133
          [ -d "$BIN" ] || {
            echo "::error::no image directory at $BIN"; exit 1; }
          ls -l "$BIN" || true
          UI=""
          for f in "$BIN"/*uImage*; do
            [ -f "$f" ] && UI="$f" && break
          done
          if [ -n "$UI" ]; then
            SIZE=$(stat -c %s "$UI")
            echo "the kernel image is $SIZE bytes; the kernel partition is 8 MiB"
            echo "::notice::kernel image: $SIZE bytes of 8388608"
            [ "$SIZE" -le 8388608 ] || {
              echo "::error::the kernel image does not fit the 8 MiB kernel partition" >&2
              exit 1; }
          else
            echo "::warning::no kernel image under $BIN - the image profile did not make one"
          fi
          mkdir -p images
          cp -a "$BIN"/. images/
          ls -l images

      # The packages the board needs have to be in the image, not merely
      # selected in the configuration: a package that defconfig keeps can
      # still fail to install, and an image without the protocol daemon is
      # an image the board comes up with nothing to talk to.
      #
      # This is the manifest half of the release line's management gate.
      # The other half - the staged root's files, the ucode interpreter, the
      # firewall4 rule generator's own test suite - is deliberately not
      # copied: that gate is about the release line's product surface, and
      # this line's job is to produce a 7.3.4 image with the NPU in it.
      # The package list is the release line's, and every one of them is
      # already asserted in the resolved configuration by
      # scripts/configure-sk-d840n.sh.
      - name: 'Gate: the image carries the packages the board needs'
        run: |
          set -e
          MANIFEST=$( { find openwrt/bin/targets -name '*.manifest' 2>/dev/null || true; } | head -1 )
          [ -n "$MANIFEST" ] || {
            echo "::error::no target image manifest under openwrt/bin/targets"
            find openwrt/bin/targets -maxdepth 3 2>&1 | head -20 || true
            exit 1; }
          echo "manifest: $MANIFEST"
          for package in zxpond libzxpon-omci luci-app-sk-d840n-pon \
                         luci-mod-system firewall4 nftables tc-tiny \
                         luci-app-firewall rpcd-mod-ucode ucode-mod-fs; do
            grep -q "^$package " "$MANIFEST" || {
              echo "::error::the image manifest is missing $package"
              grep -E '^(zxpond|libzxpon-omci|luci-|firewall4|nftables|tc-|rpcd-|ucode-)' "$MANIFEST" || true
              exit 1; }
          done
          echo "the image carries the management packages"

      # Validate the native sysupgrade image and export its members.
      # This is the release line's own tool: it checks the fwtool metadata
      # and its CRC, the board's compatibility string, that every member
      # fits its partition, that the root really is a JFFS2 image - and
      # that the uImage decompresses to exactly the Image that was built.
      # It also writes the three partition files the flasher writes, which
      # is what the board trial needs.
      #
      # The raw Image is looked for in two places because the kernel is an
      # external tree here: the tree itself, and the build directory
      # OpenWrt made for it.
      - name: Validate and export the partitions
        run: |
          set -e
          BIN=openwrt/bin/targets/zte/zx279133
          RAW=""
          for candidate in "$KERNEL_TREE/arch/arm64/boot/Image" \
                            openwrt/build_dir/target-*/linux-*/linux-$KVER/arch/arm64/boot/Image; do
            for f in $candidate; do
              [ -f "$f" ] && RAW="$f" && break
            done
            [ -n "$RAW" ] && break
          done
          [ -n "$RAW" ] || { echo "::error::no raw Image for linux-$KVER"; exit 1; }
          echo "raw kernel: $RAW"
          SYS=$( { ls "$BIN"/*sysupgrade.bin 2>/dev/null || true; } | head -1 )
          if [ -z "$SYS" ]; then
            echo "::warning::no sysupgrade image under $BIN - nothing to validate or export"
            exit 0
          fi
          echo "sysupgrade image: $SYS"
          python3 tools/check_sysupgrade.py \
            --image "$SYS" \
            --raw-kernel "$RAW" \
            --fwtool openwrt/staging_dir/host/bin/fwtool \
            --export-dir . > sysupgrade-report.json
          cat sysupgrade-report.json
          # The report names the kernel this image ships, and the name is
          # compared with the image on disk rather than taken on the
          # report's word.  The gate in front of a flash reads the expected
          # version out of this report, so a report that names the wrong
          # kernel would let a stale image through.
          python3 tools/check-release-kernel-version.py \
            --report sysupgrade-report.json --image flash-uImage
          ls -l flash-uImage flash-dtb.bin flash-rootfs.jffs2 \
                flash-sysupgrade.bin immortalwrt-sk-d840n-sysupgrade.bin
          # The partition table in the dtb that is about to be flashed has to
          # be the board's: root at 0xf00000, the final 241 MiB, and the
          # sixth mtd child.  This reads the artifact, because the artifact
          # is what goes on the board - and the table inside a dtb is the
          # one thing about it that a panic on the wrong partition would
          # not explain over a serial that never comes up.
          python3 tools/dtbparts.py flash-dtb.bin layout=native241 root=0xf00000,0xf100000
          cp -a flash-uImage flash-dtb.bin flash-rootfs.jffs2 \
                flash-sysupgrade.bin immortalwrt-sk-d840n-sysupgrade.bin \
                sysupgrade-report.json images/
          # The manifest travels with the files: the artifact's listing is
          # public but its content needs a session, so the image is fetched
          # by hand - and a hand-fetched image has to be verifiable before
          # it is written to a board.  The manifest is checked here too, so
          # a manifest that does not describe the files cannot ship.
          ( cd images && sha256sum flash-uImage flash-dtb.bin flash-rootfs.jffs2 \
                flash-sysupgrade.bin immortalwrt-sk-d840n-sysupgrade.bin \
                sysupgrade-report.json > sha256sums )
          ( cd images && sha256sum -c sha256sums )

      # The gates above say that the drivers are configured as built-in, that
      # clang can parse them, that the Kbuild wires them in and that the
      # device tree names a driver for every compatible it mentions.  All four
      # are statements about the tree and the configuration.  None of them
      # looked at the bytes that go on the board, and "in the tree", "compiles",
      # "configured as built-in" and "in the flashed image" are four different
      # claims - a driver that is never compiled, or that is compiled into a
      # module the RAM image does not load, produces an image that builds
      # cleanly and comes up with no network port at all.
      #
      # So the artifact itself is asked: each probe names a string that exists
      # in one of our own sources and has to exist in the inflated kernel.
      # Both halves are checked, and a probe whose source no longer carries
      # the string is reported as stale rather than passed.
      #
      # Only the flash mode has such an artifact.  The initramfs mode builds
      # a RAM rescue image and no kernel image of its own - run #43 said so
      # ("no kernel image under openwrt/bin/targets/zte/zx279133 - the image
      # profile did not make one") - so there is nothing here to ask about,
      # and a gate that asks anyway fails a build that did nothing wrong.
      - name: 'Gate: the image carries the board drivers'
        if: matrix.mode == 'flash'
        run: |
          set -e
          python3 tools/check-sk-image-drivers.py \
            --image flash-uImage \
            --manifest configs/sk-d840n-73-image-drivers.json \
            --tree "$KERNEL_TREE" \
            --board-layer kernel-overlays-73 \
            --report sk-image-drivers.json
          cat sk-image-drivers.json

      # The gate above says the tree has a way back from a datapath that
      # could not be brought up, and that the way back comes before the
      # check for the hardware.  That is a statement about the source, and
      # the compiler gets the last word.
      #
      # This gate is a statement about the machine code the board runs: the
      # kernel is built with debug information, so the compiler's line table
      # says which source line every instruction came from, and the gate
      # reads the two lines out of the source and asks the machine code
      # where they landed.  The order that is checked is the branch against
      # the restore, not a load against a load: a load can be moved, but a
      # branch that decides whether the open fails cannot be moved in front
      # of a restore that can change what it tests.
      #
      # And the machine code that was read has to be the machine code that
      # goes on the board: the gate looks for those bytes in the image that
      # is about to be flashed, so a tree that is not the image says nothing
      # about a board.
      #
      # The controls run on the same kernel and the same image - a
      # synthetic one would only prove that the gate reads a synthetic one.
      - name: 'Gate: the restore comes before the hardware check in the machine code'
        if: matrix.mode == 'flash'
        run: |
          set -e
          KT=$( { ls -d openwrt/build_dir/target-*/linux-*/linux-$KVER 2>/dev/null || true; } | head -1 )
          [ -n "$KT" ] || { echo "::error::no kernel build tree for linux-$KVER"; exit 1; }
          [ -f "$KT/vmlinux" ] || { echo "::error::no vmlinux under $KT"; exit 1; }
          OBJDUMP=$( { ls openwrt/staging_dir/toolchain-*/bin/aarch64-*-objdump 2>/dev/null || true; } | head -1 )
          if [ -z "$OBJDUMP" ]; then
            OBJDUMP=$( { ls openwrt/staging_dir/toolchain-*/bin/*-objdump 2>/dev/null || true; } | head -1 )
          fi
          [ -n "$OBJDUMP" ] || { echo "::error::no objdump in the toolchain"; exit 1; }
          echo "kernel: $KT"
          echo "objdump: $OBJDUMP"
          python3 tools/check-sk-kernel-order.py \
            --vmlinux "$KT/vmlinux" \
            --image flash-uImage \
            --tree "$KT" \
            --objdump "$OBJDUMP" \
            --report sk-kernel-order.json
          cat sk-kernel-order.json
          python3 tests/test_sk_kernel_order.py \
            --vmlinux "$KT/vmlinux" \
            --image flash-uImage \
            --tree "$KT" \
            --objdump "$OBJDUMP"

      - name: Upload the images
        uses: actions/upload-artifact@v4
        with:
          name: sk-d840n-73-images-${{ matrix.mode }}
          path: images/
          retention-days: 14

      # The gate that says the thing that was built is the thing that was
      # asked for: the version in the tree, the version in the Image banner
      # and the version the modules are packaged under.
      - name: 'Gate: the built kernel is 7.3.4'
        run: |
          KT="$KERNEL_TREE"
          python3 tools/prepare-sk-kernel-73.py --check-built "$KT" --version "$KVER"

      - name: 'Gate: the board device tree compiles against the 7.3 tree'
        run: |
          KT="$KERNEL_TREE"
          DTS=$KT/arch/arm64/boot/dts/zte
          PFX=$KT/scripts/dtc/include-prefixes
          dtc --version
          f=$DTS/zx279133-sk-d840n.dts
          cpp -nostdinc -undef -x assembler-with-cpp -D__DTS__ \
              -I "$DTS" -I "$PFX" -I "$KT/include" "$f" -o /tmp/sk.pp.dts
          dtc -q -I dts -O dtb -o /tmp/sk-d840n.dtb -i "$PFX" -i "$KT/include" /tmp/sk.pp.dts
          test -s /tmp/sk-d840n.dtb
          echo "the board device tree compiles"
          # It also has to say the same partition table as the board's.  The
          # table inside the dtb is what decides where root is, U-Boot's
          # bootargs hard-code root=/dev/mtdblock5, and the board's table
          # puts root at 0xf00000 with the final 241 MiB.  A table that is
          # off by one erase block writes the jffs2 where the new kernel
          # will not look for it - a panic with no serial to read.
          #
          # This reads the blob that was compiled, not the dts we think we
          # wrote.  The 6.18 line has the same gate (build-sk-d840n.yml).
          python3 tools/dtbparts.py /tmp/sk-d840n.dtb layout=native241 root=0xf00000,0xf100000

      # The panel LEDs are how this board says things when it has no console,
      # and the LOS lamp is one of the six readings the board trial takes:
      # it has to follow the optical signal (light present -> lamp dark).
      # The 6.18 release line has this gate (build-sk-d840n.yml:663); the 7.3
      # line had none, so a device tree with a changed GPIO, a changed
      # polarity, a changed trigger or a second consumer of the same pin
      # would reach the board - and the LOS reading would then mean nothing
      # without anything looking wrong.
      #
      # It reads the blob this line compiled, not the dts we think we wrote.
      # The second command is the gate's own negative controls: it mutates the
      # same tree in memory and requires every mutation to be rejected, so a
      # gate that accepts anything cannot pass here.
      # The third command checks the merged kernel config for the seven LED
      # symbols the panel needs - the custom zx279133-los / zx279133-pon
      # triggers live behind CONFIG_LEDS_TRIGGERS, and a merge that clamped
      # them to =m would leave the board dark with no error anywhere.
      - name: 'Gate: the panel LED topology and its kernel support'
        run: |
          set -e
          python3 tools/check-sk-lan1-led.py --dtb /tmp/sk-d840n.dtb
          python3 tests/test_sk_lan1_led.py --dtb /tmp/sk-d840n.dtb
          KC=$( { ls -d openwrt/build_dir/target-*/linux-*/linux-$KVER/.config 2>/dev/null || true; } | head -1 )
          [ -n "$KC" ] || {
            echo "::error::no merged kernel .config for linux-$KVER"
            ls -d openwrt/build_dir/target-*/linux-* 2>&1 || true
            exit 1; }
          python3 tools/check-sk-lan1-led.py --kernel-config "$KC"

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sk-d840n-73-logs
          path: |
            compile.log
            sk-configure.log
            kernel-provenance-73.json
          retention-days: 14
