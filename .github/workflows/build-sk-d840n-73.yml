name: ZX279133 SK-D840N Build (Linux 7.3 line)

# The 7.3 bring-up line.
#
# It builds the same board on the kernel generation the reference firmware
# runs (Linux 7.3.4), with cnjn's rewritten ZX279133 NPU driver, and it does
# NOT publish anything: the release line is build-sk-d840n.yml, and this
# workflow only produces an image to look at.
#
# The kernel is not a submodule and not a fork here.  cnjn ships the driver
# as a patch series (target/linux/zte/patches-7.3) that is applied to a
# VANILLA linux-7.3.4, so this workflow:
#
#   1. fetches linux-7.3.4.tar.xz and refuses it unless its sha256 matches
#      configs/sk-d840n-73.json,
#   2. applies the vendored series in kernel-patches/7.3/ one patch at a time,
#      refusing anything that does not apply cleanly,
#   3. copies the board layer (device tree, Unim NAND, DSA VID range) on top,
#      and the NPU microcode into the tree,
#   4. hands the result to OpenWrt through CONFIG_EXTERNAL_KERNEL_TREE.
#
# Every step of 1-3 has been run on the build machine of this repository and
# is the same code as tools/prepare-sk-kernel-73.py and
# tools/apply-sk-overlay-73.sh.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '构建模式'
        required: false
        default: 'initramfs'
        type: choice
        options: ['initramfs', 'flash']
      clean_cache:
        description: '忽略 dl/ 缓存'
        required: false
        default: 'false'
        type: boolean
  push:
    paths:
      - .github/workflows/build-sk-d840n-73.yml
      - kernel-patches/**
      - tools/prepare-sk-kernel-73.py
      - tools/apply-sk-overlay-73.sh
      - tools/check-sk-board-api.py
      - tools/check-sk-switch-api.py
      - tools/check-sk-pon-api.py
      - tools/check-sk-9132-api.py
      - kernel-overlays-73/**
      - tools/prepush.py
      - overlays-73/**
      - configs/sk-d840n-73.json
      - scripts/configure-sk-d840n.sh
      # The Configure step sources these two, so a change in either of them
      # changes what this line builds and has to start a build.
      - scripts/sk-d840n-offload.sh
      - scripts/sk-d840n-theme.sh
      - docs/101-*

env:
  IW_URL: https://github.com/cnjn/ImmortalWrt
  IW_BRANCH: master
  # cnjn/ImmortalWrt master, 2026-11-10.  This is the commit that carries
  # target/linux/zte/patches-7.3 and target/linux/zte/zx279133/config-7.3.
  IW_SHA: 31e2ac4ded9c8896c7aefd3dcb9a46ef77440fbd
  KVER: '7.3.4'
  KERNEL_TREE: linux-7.3.4

permissions: write-all

jobs:
  check-gates:
    name: repository gates
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install DTS regression tools
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends device-tree-compiler libfdt-dev python3-yaml
      - name: Exercise the repository's own gates
        run: |
          python3 tests/test_sk_kernel.py
          python3 tests/test_sk_led_dts_gate.py
          python3 tests/test_sk_layout.py
          python3 tests/test_sk_uboot.py
          python3 tests/test_sk_workflows.py

  build:
    name: ${{ matrix.mode }}
    needs: check-gates
    strategy:
      fail-fast: false
      matrix:
        mode: [initramfs, flash]
    runs-on: ubuntu-22.04
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --force || true
          sudo -E apt-get -qq autoremove --purge || true
          df -hT

      - name: Init build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libfdt-dev libglib2.0-dev libgmp3-dev libjson-c-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp \
            nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-venv python3-ply python3-docutils \
            python3-pyelftools bc dwarves qemu-utils qemu-user re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      # The OMCI engine is a Rust package: overlays/package/libs/libzxpon-omci
      # builds it with cargo for aarch64-unknown-linux-musl.  The 6.18 line
      # installs the toolchain in its own step; this line had none, so
      # ZX_CARGO stayed empty, the package's Build/Compile ran "cargo build"
      # with no cargo to run it, and the whole build died at the end of the
      # Compile step with
      #   ERROR: package/libs/libzxpon-omci failed to build.
      # That is what runs 1 to 13 of this line reported, and the kernel was
      # never the thing that failed.
      #
      # The assertions are the point of the step: without them the missing
      # toolchain is only noticed fifty minutes later, in a package log
      # nobody can read.
      - name: Rust 1.96.1 for the OMCI engine
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup target add --toolchain 1.96.1 aarch64-unknown-linux-musl
          ZX_CARGO="$(rustup which --toolchain 1.96.1 cargo)"
          if [ ! -x "$ZX_CARGO" ]; then
            echo "::error::no cargo at $ZX_CARGO"; exit 1
          fi
          if [ ! -x "$(dirname "$ZX_CARGO")/rustc" ]; then
            echo "::error::no rustc next to $ZX_CARGO"; exit 1
          fi
          if ! rustup target list --toolchain 1.96.1 --installed \
              | grep -qx aarch64-unknown-linux-musl; then
            echo "::error::the aarch64-unknown-linux-musl target is not installed"; exit 1
          fi
          "$ZX_CARGO" --version
          echo "ZX_CARGO=$ZX_CARGO" >> "$GITHUB_ENV"

      - name: Clone the OpenWrt tree
        run: |
          git clone --depth 1 -b "$IW_BRANCH" "$IW_URL" openwrt
          git -C openwrt fetch --depth 1 origin "$IW_SHA"
          git -C openwrt checkout --detach "$IW_SHA"
          test "$(git -C openwrt rev-parse HEAD)" = "$IW_SHA"
          test -d openwrt/target/linux/zte/patches-7.3
          test -f openwrt/target/linux/generic/kernel-7.3
          test -f openwrt/target/linux/zte/zx279133/config-7.3

      # The step the 6.18 line does not have.  It replaces the kernel fork
      # with a vanilla tarball plus a pinned patch series, and it is the only
      # place the 7.3 driver comes from.
      - name: Prepare the Linux 7.3.4 tree
        run: |
          python3 tools/prepare-sk-kernel-73.py \
            --tree "$KERNEL_TREE" \
            --version "$KVER" \
            --openwrt openwrt \
            --report kernel-provenance-73.json
          test "$(make -s -C "$KERNEL_TREE" kernelversion)" = "$KVER"
          cat kernel-provenance-73.json

      # The board layer is the only code in this repository that is new on the
      # 7.3 line: cnjn's driver set has no Unim NAND driver and no SK-D840N
      # device tree, so these files are ours and they have to fit the tree.
      # Nothing on the machine that pushes this repository can compile them -
      # there is no aarch64 cross toolchain there - so the kernel API they
      # use is checked here instead, before the seventy-minute Compile.
      #
      # pre  runs on the tree before the overlay goes in: it checks that every
      #      macro, type and accessor the new files use exists in the tree,
      #      and records cnjn's own DSA header values as the baseline.
      # post runs on the tree after the overlay went in: it checks that the
      #      board files landed, that the device tree resolves, and that the
      #      header the tagger now sees still defines every macro the tagger
      #      uses - and it compares the values against the baseline, because a
      #      changed macro value changes what the tagger accepts at runtime
      #      and a green compile cannot tell that apart.
      - name: Check the board layer against the 7.3 tree
        run: |
          python3 tools/check-sk-board-api.py pre \
            --tree "$KERNEL_TREE" --report sk-board-api.json

      - name: Apply the board layer
        run: |
          sh tools/apply-sk-overlay-73.sh "$KERNEL_TREE"

      - name: Check the applied board layer
        run: |
          python3 tools/check-sk-board-api.py post \
            --tree "$KERNEL_TREE" --report sk-board-api.json

      # The 9132 LAN switch driver is this repository's own code in the 7.3
      # tree, and it cannot be compiled on the machine that pushes this
      # repository either.  So the things a compiler would say about it are
      # checked here instead: every name it uses has to be defined, every
      # kernel function it calls has to exist, the LAN service it talks to
      # has to provide the operations it calls - including the control
      # transaction that patch 130 adds - and the Kconfig symbol, the
      # Makefile object and the device tree node have to line up.
      - name: Check the 9132 switch driver against the 7.3 tree
        run: |
          python3 tools/check-sk-switch-api.py \
            --tree "$KERNEL_TREE" --repo "$GITHUB_WORKSPACE"

      # The PON / OMCI stack is this repository's own code in the 7.3 tree
      # as well, and it cannot be compiled here either.  What is checked
      # instead: the protocol core is closed, every kernel name the stack
      # calls is visible in the file's own include closure, the tree's eth
      # structure carries the fields the stack uses, the four hooks - the
      # attach, the stop, the carrier kick and the management queue's
      # prepare - are where the tree expects them, the three objects are in
      # the NPU module, and the LED class the new code needs is on.
      - name: Check the PON / OMCI stack against the 7.3 tree
        run: |
          python3 tools/check-sk-pon-api.py \
            --tree "$KERNEL_TREE" --repo "$GITHUB_WORKSPACE" \
            --openwrt openwrt

      # The 9132's own programming is this repository's own code in the 7.3
      # tree as well, and it cannot be compiled here either.  What is checked
      # instead: the programming is in the tree's np.c, the ERAM table
      # bookkeeping is there and the SE allocator records the descriptors it
      # hands out, every name the block uses is defined, every kernel
      # function it calls exists, nothing is defined twice in np.c or idm.c,
      # the prepare function runs the programming in the right order, and the
      # board device tree names the MDIO bus the PHY enable looks for.
      - name: Check the 9132 switch programming against the 7.3 tree
        run: |
          python3 tools/check-sk-9132-api.py \
            --tree "$KERNEL_TREE" --repo "$GITHUB_WORKSPACE"

      - name: Apply the OpenWrt-side overlays
        run: |
          cp -a overlays/. openwrt/
          # overlays-73/ holds the files that differ between the kernel
          # lines on the OpenWrt side: the zte target itself and the
          # subtarget defaults.
          cp -a overlays-73/. openwrt/
          test -f openwrt/target/linux/zte/image/Makefile
          grep -q 'Device/skyworth_sk-d840n' openwrt/target/linux/zte/image/Makefile
          grep -q 'KERNEL_PATCHVER:=7.3' openwrt/target/linux/zte/Makefile
          # The subtarget defaults have to clear OpenWrt's tweak list.
          # include/target.mk seeds it with "luci", the LuCI metapackage,
          # and the metapackage pulls luci-light, which depends on
          # luci-theme-bootstrap - so keeping the list would leave the
          # resolved config with Bootstrap next to Argon and the theme
          # check would refuse it.  Run 45012472909 is that failure.
          test -f openwrt/target/linux/zte/zx279133/target.mk
          grep -qx 'DEFAULT_PACKAGES.tweak:=' openwrt/target/linux/zte/zx279133/target.mk
          grep -q 'luci-theme-argon' openwrt/target/linux/zte/zx279133/target.mk

      # The 7.3 fragments are named config-7.3, not config-6.18.  This is the
      # same edit the 6.18 line makes, with the other file names: a fragment
      # that still says "not set" anywhere under target/linux outranks the
      # pin, and the merged result is what decides the outcome.
      - name: Enable /dev/mem in the 7.3 fragments
        run: |
          DEVMEM_OFF='# CONFIG_DEVMEM is not set'
          for f in openwrt/target/linux/generic/config-7.3 \
                   openwrt/target/linux/zte/config-7.3 \
                   openwrt/target/linux/zte/zx279133/config-7.3; do
            if [ -f "$f" ]; then
              sed -i "s|^${DEVMEM_OFF}\$|CONFIG_DEVMEM=y|" "$f"
              if grep -qxF "$DEVMEM_OFF" "$f"; then
                echo "::error::$f still disables CONFIG_DEVMEM after the edit"; exit 1
              fi
              echo "  $f -> $(grep -cx 'CONFIG_DEVMEM=y' "$f") CONFIG_DEVMEM=y line(s)"
            fi
          done
          LEFT=$(grep -rl -x "$DEVMEM_OFF" openwrt/target/linux/generic/config-7.3 \
                 openwrt/target/linux/zte/config-7.3 openwrt/target/linux/zte/zx279133/config-7.3 2>/dev/null || true)
          if [ -n "$LEFT" ]; then
            echo "::error::a fragment still disables CONFIG_DEVMEM: $LEFT"; exit 1
          fi
          SUBCFG=openwrt/target/linux/zte/zx279133/config-7.3
          if [ ! -f "$SUBCFG" ] || ! grep -qx 'CONFIG_DEVMEM=y' "$SUBCFG"; then
            echo "::error::no CONFIG_DEVMEM=y in $SUBCFG, the fragment merged last"; exit 1
          fi

      # The zte drivers have to be built into the kernel, not into modules.
      #
      # cnjn's config-7.3 carries CONFIG_ZTE_ZX279133_ETH=m, because the
      # reference firmware loads npu.ko from /etc/modules-boot.d.  That file
      # is in the firmware this repository reverse engineered, and it says
      # exactly what the vendor's image does:
      #   etc/modules.d/30-zte-npu       "npu vlan_offload=1"
      #   etc/modules-boot.d/30-zte-npu  -> ../modules.d/30-zte-npu
      #   etc/modules.d/32-zte-npu-pon   "npu-pon"
      #   etc/modules.d/42-zte-fnoffload "fnoffload vlan_offload=1"
      # Nothing here has that loader.  There is no kmod package for these
      # modules, and OpenWrt does not put an in-tree module into the rootfs
      # unless a kmod-* package declares it - so with =m the 7.3 image would
      # come up with no NPU in it at all, and nothing in it would ever load
      # one.
      #
      # The dependency makes it worse than a missing module.  kconfig clamps
      # a tristate symbol whose dependency is modular to =m:
      # scripts/kconfig/symbol.c:471-474 takes EXPR_AND of the requested
      # value with the symbol's visibility, and a symbol that depends on a
      # modular one is visible as "mod", not "yes".  So the
      # CONFIG_ZTE_ZX279133_SWITCH=y that scripts/configure-sk-d840n.sh pins
      # is silently demoted to =m while CONFIG_ZTE_ZX279133_ETH=m - and the
      # board's own device tree names the 9132 switch node
      # (compatible = "zte,zx279133-switch"), which a module can never bind,
      # because nothing loads it.
      #
      # The 6.18 release line has this arrangement already, and the running
      # image confirms it: docs/07 records "CONFIG_ZTE_ZX279133_ETH=y  <--
      # 网卡驱动内建" out of that board's /proc/config.gz, with no .ko files
      # under /lib/modules at all.  These three pins put the 7.3 line on the
      # same footing.
      - name: Build the zte drivers into the kernel
        run: |
          set -e
          DRVCFG=openwrt/target/linux/zte/zx279133/config-7.3
          [ -f "$DRVCFG" ] || {
            echo "::error::$DRVCFG is gone - the clone's layout changed"; exit 1; }
          for sym in ZTE_ZX279133_ETH ZTE_ZX279133_LAN_CONDUIT ZTE_ZX279133_SWITCH; do
            if grep -q "^CONFIG_${sym}=" "$DRVCFG"; then
              sed -i "s|^CONFIG_${sym}=.*|CONFIG_${sym}=y|" "$DRVCFG"
            elif grep -q "^# CONFIG_${sym} is not set\$" "$DRVCFG"; then
              sed -i "s|^# CONFIG_${sym} is not set\$|CONFIG_${sym}=y|" "$DRVCFG"
            else
              printf 'CONFIG_%s=y\n' "$sym" >>"$DRVCFG"
            fi
            grep -qx "CONFIG_${sym}=y" "$DRVCFG" || {
              echo "::error::could not pin CONFIG_${sym}=y in $DRVCFG"; exit 1; }
          done
          grep -E '^CONFIG_ZTE_ZX279133' "$DRVCFG" || true

      - name: Check the overlay for what a compiler would have caught
        run: |
          python3 tools/prepush.py "$GITHUB_WORKSPACE"

      # The 6.18 release line has this step and the 7.3 line did not, and the
      # difference was worth two Configure failures (runs 45009499015 and
      # 45010154919, both at "Argon is not built into the resolved SK-D840N
      # config").
      #
      # The reason is a file, not a package list: the Argon recipe ends with
      #   include $(TOPDIR)/feeds/luci/luci.mk
      # (jerrykuku/luci-theme-argon Makefile:54).  Without the luci feed there
      # is no luci.mk, so the recipe cannot be parsed, so the package never
      # enters the package database, so defconfig drops
      # CONFIG_PACKAGE_luci-theme-argon=y in silence - the same way it drops
      # a config line for a symbol that does not exist.  The theme check then
      # reports it, which is the only reason the failure was legible at all.
      #
      # The feeds are also where luci-base comes from, and Argon depends on
      # it (LUCI_DEPENDS:=+luci-base ...), so the package could not have been
      # selected even with luci.mk present.
      - name: Install feeds
        working-directory: openwrt
        # A clone that stalls must fail, not wait: git has no default
        # timeout, and a feed that half-arrives leaves the build that
        # follows it waiting on a tree that never finishes arriving.
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 60
          GIT_TERMINAL_PROMPT: 0
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # The theme check runs against the resolved .config, so the feed
          # that carries it has to be there before Configure, not after.
          test -f feeds/luci/luci.mk
          test -f package/feeds/luci/luci-base/Makefile

      - name: Configure
        run: |
          set +e
          (
            set -e
            sh scripts/prepare-sk-d840n-ui.sh "$GITHUB_WORKSPACE/openwrt"
            sh scripts/configure-sk-d840n.sh \
              "$GITHUB_WORKSPACE/openwrt" \
              "$GITHUB_WORKSPACE/$KERNEL_TREE" \
              "${{ matrix.mode }}"
          ) 2>&1 | tee sk-configure.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" != 0 ]; then
            message=$(tail -n 65 sk-configure.log | python3 -c 'import sys; s=sys.stdin.read()[-2600:]; print(s.replace("%","%25").replace("\r","").replace("\n","%0A"))')
            echo "::error::$message"
            exit "$rc"
          fi
          set -e

      # The theme check refuses a config that carries more than one theme,
      # and the way Bootstrap got there was the tweak list: include/target.mk
      # seeds it with "luci", the metapackage, and the metapackage pulls
      # luci-light, which depends on luci-theme-bootstrap.  The 7.3 subtarget
      # defaults clear the list, so the metapackage must not be in the
      # resolved config - and if it is, the theme check passed for the wrong
      # reason and the image would ship both themes.
      - name: 'Gate: the resolved config carries exactly one theme'
        run: |
          cd openwrt
          if grep -q '^CONFIG_PACKAGE_luci=y' .config; then
            echo "::error::the LuCI metapackage is selected, so luci-light will pull luci-theme-bootstrap in"
            grep -E '^CONFIG_PACKAGE_luci(-theme-[a-z-]+)?=' .config || true
            exit 1
          fi
          echo "--- the themes in the resolved config ---"
          grep -E '^CONFIG_PACKAGE_luci-theme-' .config || true

      - name: Download packages
        working-directory: openwrt
        env:
          CURL_OPTIONS: --speed-limit 100 --speed-time 120
          WGET_OPTIONS: --read-timeout=120 --timeout=120
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile
        working-directory: openwrt
        run: |
          set -o pipefail
          timeout --kill-after=60s 280m bash -c 'make -j"$(nproc)"' 2>&1 | tee ../compile.log || rc=$?
          rc=${rc:-0}
          echo "::group::the tail of the build log"
          tail -n 200 ../compile.log
          echo "::endgroup::"
          if [ "$rc" != 0 ]; then
            # The job log of a run is not readable without a GitHub login, but
            # an annotation is: the annotations of a run are public.  So the
            # reason the build failed has to go into one, or the only thing
            # that can be said about a failed run is "exit code 2".
            #
            # Two places have to be read.  OpenWrt keeps each package's own
            # build output under logs/, and the top level log only says which
            # package failed - so the compiler's message is in the package's
            # log, not in compile.log.  And the top level log's own failure
            # line is "ERROR: failed to build package ..." in upper case, so
            # the search has to be case insensitive or that line is missed
            # too.
            #
            # The package logs come first: they carry the reason.  The top
            # level lines say which package, which is the second question.
            {
              grep -rnaEi "fatal error:|error:|error\[|undefined reference|undefined symbol|implicit declaration|No such file|command not found|not found|failed to resolve|cannot find" logs 2>/dev/null | head -n 12 || true
              grep -naEi "\*\*\*|failed to build|No rule to make|\berror:" ../compile.log 2>/dev/null | head -n 8 || true
            } | head -n 10 | while IFS= read -r line; do
              echo "::error::cc: $(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/#/%23/g' | tr -d '\r')"
            done
            {
              echo "### the compiler's own message"
              echo
              echo '```'
              grep -rnaEi "fatal error:|error:|error\[|undefined reference|undefined symbol|implicit declaration|No such file|command not found|not found|failed to resolve|cannot find" logs 2>/dev/null | head -n 30 || true
              grep -naEi "\*\*\*|failed to build|No rule to make|\berror:" ../compile.log 2>/dev/null | head -n 20 || true
              echo '```'
              echo
              echo "### the tail of the top level build log"
              echo
              echo '```'
              tail -n 40 ../compile.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      # The pins above are an intention; the merged kernel config is the
      # result.  A symbol that does not exist in the tree, and a tristate
      # symbol whose dependency is modular, are both dropped in silence -
      # and the image that comes out of that has no NPU in it, which looks
      # exactly like a board that does not boot.  So the three symbols are
      # checked against the kernel's own .config, the way the 6.18 line
      # checks its PHY and its netfilter set.
      - name: 'Gate: the zte drivers are built into the kernel'
        run: |
          set -e
          KC=$( { ls -d openwrt/build_dir/target-*/linux-*/linux-$KVER/.config 2>/dev/null || true; } | head -1 )
          if [ -z "$KC" ] && [ -f "$KERNEL_TREE/.config" ]; then
            KC="$KERNEL_TREE/.config"
          fi
          [ -n "$KC" ] || {
            echo "::error::no merged kernel .config for linux-$KVER; what is there:"
            ls -d openwrt/build_dir/target-*/linux-* 2>&1 || true
            ls -l "$KERNEL_TREE/.config" 2>&1 || true
            exit 1; }
          echo "kernel config: $KC"
          for s in ZTE_ZX279133_ETH ZTE_ZX279133_LAN_CONDUIT ZTE_ZX279133_SWITCH; do
            grep -qx "CONFIG_$s=y" "$KC" || {
              echo "::error::CONFIG_$s is not built into the kernel" >&2
              { grep -E "^CONFIG_${s}=|^# CONFIG_${s} is not set" "$KC" \
                  || echo "    CONFIG_$s is absent from the merged config"; } >&2
              grep -iE '^CONFIG_(ZTE_ZX279133|NET_DSA|PCS_XPCS|LEDS_CLASS|PHY_ZX279133)' "$KC" >&2 || true
              exit 1; }
          done
          grep -iE '^CONFIG_(ZTE_ZX279133|NET_DSA_TAG_ZX279133)' "$KC" || true

      # The gate that says the thing that was built is the thing that was
      # asked for: the version in the tree, the version in the Image banner
      # and the version the modules are packaged under.
      - name: 'Gate: the built kernel is 7.3.4'
        run: |
          KT="$KERNEL_TREE"
          python3 tools/prepare-sk-kernel-73.py --check-built "$KT" --version "$KVER"

      - name: 'Gate: the board device tree compiles against the 7.3 tree'
        run: |
          KT="$KERNEL_TREE"
          DTS=$KT/arch/arm64/boot/dts/zte
          PFX=$KT/scripts/dtc/include-prefixes
          dtc --version
          f=$DTS/zx279133-sk-d840n.dts
          cpp -nostdinc -undef -x assembler-with-cpp -D__DTS__ \
              -I "$DTS" -I "$PFX" -I "$KT/include" "$f" -o /tmp/sk.pp.dts
          dtc -q -I dts -O dtb -o /tmp/sk-d840n.dtb -i "$PFX" -i "$KT/include" /tmp/sk.pp.dts
          test -s /tmp/sk-d840n.dtb
          echo "the board device tree compiles"

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sk-d840n-73-logs
          path: |
            compile.log
            sk-configure.log
            kernel-provenance-73.json
          retention-days: 14
